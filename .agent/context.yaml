project:
  name: sce-product-odoo-clean-root
  role: 产品净根仓库（product clean root）

architecture:
  backend:
    type: odoo
  frontend:
    type: vue

authoritative:
  execution_policy:
    path: AGENTS.md
  ops_allowlist:
    path: docs/ops/codex_execution_allowlist.md
  architecture_guard:
    path: ARCHITECTURE_GUARD.md
  product_boundary:
    path: docs/product/formal_product_boundary_v1.md

governance:
  branch_policy: '^(feature|fix|refactor|audit|release|codex)/.+'
  preflight: 'pwd + git rev-parse --show-toplevel + git branch --show-current + git status --short'
